# 公司人数规模（人工核对，仅收录有公开出处的数字）
#
# 这份文件回答一个问题：这家公司大概多大。它不参与评分，只在页面上显示一个
# 小标签（鼠标悬停能看到出处和数据截止时间）。
#
# 收录规则——宁缺毋滥：
#   1. 只收「员工总数」口径：不混用参保人数、劳务派遣、外包人数，这三者能差一倍。
#   2. 必须有明确出处（年度报告 / 官网 / 权威媒体），写进 source。
#   3. 写清数据截止时间 as_of，人数变化大的公司（比如光伏、车企）尤其重要。
#   4. 拿不准就不写。页面没有这个标签，比标一个错数字好。
#
# 字段：
#   employees  员工总数（整数，按来源原值，不四舍五入）
#   as_of      数据截止时间，例如 "2024年末"
#   source     出处，例如 "2024 年年度报告"
#   aliases    别名，用于匹配（公司 id、英文名、简称都可以）
#
# 想补充：按同样格式加一条即可，改完刷新页面就生效，不用重启。
