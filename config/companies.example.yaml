# 岗位监控企业清单（示例）
#
# 复制为 config/companies.yaml 后使用：
#   cp config/companies.example.yaml config/companies.yaml
#
# 字段说明：
#   id                  唯一标识，全库主键，建库后不要随意改动
#   name                展示名称
#   careers_url         招聘入口页（部分适配器会把它用作 Referer，尽量填真实页）
#   crawler             采集适配器 key，见 packages/recruitment_core/crawlers/__init__.py
#   integration_status  connected = 参与采集；pending_verification = 只登记不采集
#   industries          行业标签，仅用于展示与筛选
#   recruitment_types   campus（校招）/ internship（实习）
#   recruitment_targets 目标届别标签，信息性字段
#
# 重要：下面全部是「真实实现」的适配器。
# 上游 crawlers/placeholders.py 里还有 18 个占位类（商汤、地平线、Momenta、PonyAI、
# 文远知行、蔚来、小鹏等），它们返回空列表，配置进去只会白跑，故不列入
#（大华是占位类，这里改用通用 beisen 接入，见文件末尾）。
#
# 加入新公司的最快路径：
#   1) 招聘页域名是 *.zhiye.com      → crawler: beisen
#   2) 招聘页域名是 *.hotjob.cn      → crawler: hotjob
#   3) 招聘页在 app.mokahr.com 下    → crawler: moka
#   4) 招聘页是 jobs.*.feishu.cn     → crawler: feishu
#   5) 其他 JS 渲染站                → crawler: render（较慢，可能抓不全）

