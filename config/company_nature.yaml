# 企业性质标注（人工整理，仅供参考，可自行修改）
#
# 用途：在「公司」和「全部岗位」里显示企业性质，帮你判断这是国企、民营还是外资。
# 说明：
#   * 这里的判据是「控股背景」的粗略归类，不是工商登记信息。混合所有制、国资参股
#     但由民营团队经营的公司，不同口径会给出不同答案，本文件只给一个粗标签。
#   * 招聘公告自带 companyNature 的（约 44%），优先用公告口径，本文件只用于补缺。
#   * 键既支持企业 id（与 companies.yaml 对齐），也支持公司名。
#
# 可选值：民营 / 国资 / 外资 / 合资 / 其他
