name: CI

# Runs on demand only. The upstream test suite carries ~100 pre-existing
# failures outside the areas this fork works on, so an auto-triggered CI
# would mail a red badge on every push without saying anything about the
# code we actually change. Run it from the Actions tab ("Run workflow")
# whenever you want a full check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]" PyYAML

      - name: Run pytest
        run: python -m pytest -c pytest-public.ini

      - name: Compile Python sources
        run: python -m compileall -q apps packages evals scripts

      - name: Run frozen evaluation
        run: python -m evals.mvp_runner

      - name: Run frozen RAG evaluation
        run: python -m evals.rag_runner

      - name: Check migrations without a database
        run: python scripts/check_migrations.py

      - name: Build runtime image
        run: docker build --tag recruitops-agent-ci .
